name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - run: npm run test:handoff
      - run: npm run audit
      - run: npm audit
      - name: Preserve browser evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          path: |
            runs/platform-screenshots/
            runs/platform-tests/
          retention-days: 7
